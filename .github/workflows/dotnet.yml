name: Build & Publish NuGet

on:
  push:
    branches:
      - master
      - legacy
    tags:
      - 'v*.*.*' # release tags (e.g. v0.6.2)
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Codecs are cached by a hash of native/. Compile on a cache miss, a version tag,
  # or a manual run. Tags always compile so the published package comes from that run.
  prepare:
    name: native cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hash native inputs
        id: hash
        run: echo "hash=${{ hashFiles('native/**') }}" >> "$GITHUB_OUTPUT"

      - name: Look up linux-x64
        id: linux-x64
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/linux-x64
          key: native-codecs-${{ steps.hash.outputs.hash }}-linux-x64

      - name: Look up linux-arm64
        id: linux-arm64
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/linux-arm64
          key: native-codecs-${{ steps.hash.outputs.hash }}-linux-arm64

      - name: Look up osx-arm64
        id: osx-arm64
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/osx-arm64
          key: native-codecs-${{ steps.hash.outputs.hash }}-osx-arm64

      - name: Look up osx-x64
        id: osx-x64
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/osx-x64
          key: native-codecs-${{ steps.hash.outputs.hash }}-osx-x64

      - name: Look up win-x64
        id: win-x64
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/win-x64
          key: native-codecs-${{ steps.hash.outputs.hash }}-win-x64

      - name: Look up win-arm64
        id: win-arm64
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/win-arm64
          key: native-codecs-${{ steps.hash.outputs.hash }}-win-arm64

      - name: Decide whether to compile
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.hash.outputs.hash }}
          HIT_linux_x64: ${{ steps.linux-x64.outputs.cache-hit }}
          HIT_linux_arm64: ${{ steps.linux-arm64.outputs.cache-hit }}
          HIT_osx_arm64: ${{ steps.osx-arm64.outputs.cache-hit }}
          HIT_osx_x64: ${{ steps.osx-x64.outputs.cache-hit }}
          HIT_win_x64: ${{ steps.win-x64.outputs.cache-hit }}
          HIT_win_arm64: ${{ steps.win-arm64.outputs.cache-hit }}
        run: |
          set -euo pipefail
          echo "Native input hash: ${HASH}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && ( "${GITHUB_REF}" == "refs/heads/master" || "${GITHUB_REF}" == "refs/heads/legacy" ) ]]; then
              for rid in linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64 win-arm64; do
                if ! gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches?key=native-codecs-${HASH}-${rid}"; then
                  echo "Cache delete failed for ${rid}. This run still rebuilds."
                fi
              done
            fi
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rebuild=false
          for rid in linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64 win-arm64; do
            hit="$(printenv "HIT_${rid//-/_}")"
            echo "${rid}: cache-hit=${hit:-false}"
            if [[ "${hit}" != "true" ]]; then
              rebuild=true
            fi
          done
          echo "rebuild=${rebuild}" >> "$GITHUB_OUTPUT"

  native:
    name: native ${{ matrix.rid }}
    needs: prepare
    if: needs.prepare.outputs.rebuild == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build tools
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu*)
              sudo apt-get update
              sudo apt-get install -y cmake meson ninja-build nasm
              ;;
            macos*)
              brew install cmake meson ninja nasm
              ;;
            windows*)
              choco install nasm -y
              py -3 -m pip install meson ninja
              py -3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"
              ;;
          esac

      - name: MSVC environment
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # windows-11-arm: native ARM64 toolchain (Git Bash still reports x86_64).
          arch: ${{ matrix.rid == 'win-arm64' && 'arm64' || 'x64' }}

      - name: Build codecs
        shell: bash
        run: bash native/build.sh ${{ matrix.rid }}

      - name: Upload native binaries
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: src/ChromaFx.Native/runtimes

      - name: Cache native binaries
        uses: actions/cache/save@v6
        with:
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/${{ matrix.rid }}
          key: native-codecs-${{ needs.prepare.outputs.hash }}-${{ matrix.rid }}

  build:
    needs: [prepare, native]
    if: >-
      ${{
        !cancelled() &&
        needs.prepare.result == 'success' &&
        (needs.native.result == 'success' || needs.native.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history for SourceLink / embedded commit metadata.
          fetch-depth: 0

      - name: Download rebuilt codecs
        if: needs.native.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: src/ChromaFx.Native/runtimes
          merge-multiple: true

      - name: Restore cached linux-x64
        if: needs.native.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/linux-x64
          key: native-codecs-${{ needs.prepare.outputs.hash }}-linux-x64

      - name: Restore cached linux-arm64
        if: needs.native.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/linux-arm64
          key: native-codecs-${{ needs.prepare.outputs.hash }}-linux-arm64

      - name: Restore cached osx-arm64
        if: needs.native.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/osx-arm64
          key: native-codecs-${{ needs.prepare.outputs.hash }}-osx-arm64

      - name: Restore cached osx-x64
        if: needs.native.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/osx-x64
          key: native-codecs-${{ needs.prepare.outputs.hash }}-osx-x64

      - name: Restore cached win-x64
        if: needs.native.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/win-x64
          key: native-codecs-${{ needs.prepare.outputs.hash }}-win-x64

      - name: Restore cached win-arm64
        if: needs.native.result == 'skipped'
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: src/ChromaFx.Native/runtimes/win-arm64
          key: native-codecs-${{ needs.prepare.outputs.hash }}-win-arm64

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Align with global.json (rollForward: latestFeature).
          dotnet-version: '10.0.100'

      - name: Set package version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tagged release: strip refs/tags/ and optional leading v (v0.6.2 → 0.6.2)
            RAW=${GITHUB_REF#refs/tags/}
            VERSION=${RAW#v}
          else
            # master / legacy / PRs — build identity only; never published
            VERSION="0.6.4-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "Version set to $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore /p:Version=$VERSION /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack ChromaFx
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack src/ChromaFx/ChromaFx.csproj -c Release -o ./artifacts /p:Version=$VERSION --no-build
      - name: Pack ChromaFx.Core
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack src/ChromaFx.Core/ChromaFx.Core.csproj -c Release -o ./artifacts /p:Version=$VERSION --no-build
      - name: Pack ChromaFx.IO
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack src/ChromaFx.IO/ChromaFx.IO.csproj -c Release -o ./artifacts /p:Version=$VERSION --no-build
      - name: Pack ChromaFx.Processing
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack src/ChromaFx.Processing/ChromaFx.Processing.csproj -c Release -o ./artifacts /p:Version=$VERSION --no-build
      - name: Pack ChromaFx.PixelArt
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack src/ChromaFx.PixelArt/ChromaFx.PixelArt.csproj -c Release -o ./artifacts /p:Version=$VERSION --no-build
      - name: Pack ChromaFx.Retro
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack src/ChromaFx.Retro/ChromaFx.Retro.csproj -c Release -o ./artifacts /p:Version=$VERSION --no-build
      - name: Pack ChromaFx.Native
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet pack src/ChromaFx.Native/ChromaFx.Native.csproj -c Release -o ./artifacts /p:Version=$VERSION --no-build

      - name: Upload NuGet packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Tag-only NuGet publish (v*.*.*).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write  # Required to enable GitHub OIDC token issuance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: ./artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}  # Your nuget.org username (profile name, not email)

      - name: Publish to NuGet
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          # Symbol packages (ignore if nuget.org already has them / none produced).
          shopt -s nullglob
          snupkgs=(./artifacts/*.snupkg)
          if (( ${#snupkgs[@]} > 0 )); then
            dotnet nuget push "./artifacts/*.snupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          fi
